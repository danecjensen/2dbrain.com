---
layout: default
title: Search
---

<h2>Search</h2>

<div class="search-container">
  <input type="text" id="search-input" placeholder="Search posts..." autofocus>
  <div id="search-results"></div>
</div>

<script src="https://unpkg.com/lunr/lunr.js"></script>
<script src="/js/search.js"></script>

<style>
  .search-container {
    margin-top: 2em;
  }

  #search-input {
    width: 100%;
    padding: 12px 15px;
    font-size: 16px;
    border: 2px solid #ddd;
    border-radius: 4px;
    box-sizing: border-box;
    margin-bottom: 2em;
  }

  #search-input:focus {
    outline: none;
    border-color: #0066cc;
  }

  #search-results {
    margin-top: 2em;
  }

  .search-result {
    padding: 1em 0;
    border-bottom: 1px solid #e0e0e0;
  }

  .search-result:last-child {
    border-bottom: none;
  }

  .search-result h3 {
    margin: 0 0 0.5em 0;
    font-size: 1.2em;
  }

  .search-result h3 a {
    color: #0066cc;
    text-decoration: none;
  }

  .search-result h3 a:hover {
    text-decoration: underline;
  }

  .search-result-meta {
    color: #666;
    font-size: 0.9em;
    margin-bottom: 0.5em;
  }

  .search-result-excerpt {
    color: #333;
    line-height: 1.5;
  }

  .search-result-tags {
    margin-top: 0.5em;
  }

  .search-result-tags .tag {
    display: inline-block;
    background-color: #f0f0f0;
    color: #555;
    padding: 2px 8px;
    margin-right: 5px;
    border-radius: 3px;
    font-size: 0.8em;
  }

  .no-results {
    color: #666;
    font-style: italic;
    padding: 2em 0;
  }

  .search-loading {
    color: #666;
    padding: 1em 0;
  }
</style>
